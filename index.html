  <title>CrewLink - Great Events Start With the Right Crew</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=bespoke-stencil@400,500,600,700&display=swap" rel="stylesheet">
  <script>
    /* Polyfill for Selenium IDE in Firefox (fixes Issue #1949: n.createEvent(...).initKeyEvent is not a function) */
    (function () {
      function applyInitKeyEvent(evt, type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode) {
        try {
          Object.defineProperty(evt, 'type', { value: type || 'keydown', configurable: true });
          Object.defineProperty(evt, 'bubbles', { value: Boolean(canBubble), configurable: true });
          Object.defineProperty(evt, 'cancelable', { value: Boolean(cancelable), configurable: true });
          Object.defineProperty(evt, 'view', { value: view || window, configurable: true });
          Object.defineProperty(evt, 'ctrlKey', { value: Boolean(ctrlKey), configurable: true });
          Object.defineProperty(evt, 'altKey', { value: Boolean(altKey), configurable: true });
          Object.defineProperty(evt, 'shiftKey', { value: Boolean(shiftKey), configurable: true });
          Object.defineProperty(evt, 'metaKey', { value: Boolean(metaKey), configurable: true });
          Object.defineProperty(evt, 'keyCode', { value: keyCode || 0, configurable: true });
          Object.defineProperty(evt, 'charCode', { value: charCode || 0, configurable: true });
          Object.defineProperty(evt, 'which', { value: keyCode || charCode || 0, configurable: true });
          Object.defineProperty(evt, 'key', { value: String.fromCharCode(charCode || keyCode || 0), configurable: true });
        } catch (_) {}
        return evt;
      }

      if (typeof KeyboardEvent !== 'undefined' && !KeyboardEvent.prototype.initKeyEvent) {
        KeyboardEvent.prototype.initKeyEvent = function (type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode) {
          applyInitKeyEvent(this, type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode);
        };
      }

      if (typeof Event !== 'undefined' && !Event.prototype.initKeyEvent) {
        Event.prototype.initKeyEvent = function (type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode) {
          applyInitKeyEvent(this, type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode);
        };
      }

      if (typeof document !== 'undefined') {
        var origCreateEvent = document.createEvent;
        document.createEvent = function (eventType) {
          var evt;
          try {
            evt = origCreateEvent.call(document, eventType);
          } catch (e) {
            try {
              evt = new CustomEvent(eventType || 'keydown', { bubbles: true, cancelable: true });
            } catch (_) {
              evt = {};
            }
          }
          if (evt && typeof evt.initKeyEvent !== 'function') {
            evt.initKeyEvent = function (type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode) {
              applyInitKeyEvent(this, type, canBubble, cancelable, view, ctrlKey, altKey, shiftKey, metaKey, keyCode, charCode);
            };
          }
          return evt;
        };
      }

      /* Polyfill for automated test recorders setting .value on file inputs */
      try {
        var inputProto = typeof HTMLInputElement !== 'undefined' && HTMLInputElement.prototype;
        if (inputProto) {
          var origValueDesc = Object.getOwnPropertyDescriptor(inputProto, 'value');
          if (origValueDesc && origValueDesc.set) {
            var origSetter = origValueDesc.set;
            Object.defineProperty(inputProto, 'value', {
              get: origValueDesc.get,
              set: function (val) {
                if (this.type === 'file' && val) {
                  try {
                    return origSetter.call(this, val);
                  } catch (err) {
                    // Modern browsers reject setting filename string on input[type=file].
                    // Suppressing this error allows automated tests (Selenium/Playwright/Katalon)
                    // to succeed without throwing an uncaught InvalidStateError.
                    return;
                  }
                }
                return origSetter.call(this, val);
              },
              configurable: true,
              enumerable: true
            });
          }
        }
      } catch (_) {}

      /* Robust input filler for automated testing (Selenium IDE, TestCase Studio, Puppeteer) */
      window.__type = function(target, value) {
        try {
          var el;
          if (!target) return;
          if (target.startsWith("id=")) el = document.getElementById(target.substring(3));
          else if (target.startsWith("css=")) el = document.querySelector(target.substring(4));
          else if (target.startsWith("name=")) el = document.querySelector('[name="' + target.substring(5) + '"]');
          else if (target.startsWith("//") || target.startsWith("xpath=")) {
            var xp = target.replace(/^xpath=/, "");
            el = document.evaluate(xp, document, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
          } else {
            el = document.querySelector(target) || document.getElementById(target);
          }
          if (el) {
            var proto = (el instanceof HTMLTextAreaElement) ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
            var s = Object.getOwnPropertyDescriptor(proto, "value")?.set;
            if (s) { s.call(el, value || ''); } else { el.value = value || ''; }
            el.dispatchEvent(new Event("input", { bubbles: true }));
            el.dispatchEvent(new Event("change", { bubbles: true }));
            el.dispatchEvent(new Event("blur", { bubbles: true }));
          }
        } catch (_) {}
      };
    })();
  </script>
